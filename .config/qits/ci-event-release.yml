# The release pipeline: this repository reacts to its OWN release and publishes the binary under the
# released VERSION.
#
# THE SELECTION NAMES THIS REPOSITORY, WHICH READS LIKE A LOOP AND IS NOT — the same shape every
# sibling's release pipeline has. `SCMRelease` says only "source control has this version";
# qits-workspaces publishes it the instant the release push is accepted, and nothing here publishes
# it. The event that could loop is `SoftwareRelease`, and this file neither listens for it nor
# emits it.
#
# WHAT IS NEW HERE, AND IT IS THE POINT: before this file existed, the one binary every CI run
# downloads and execs was the only artifact on this platform no release train could announce. It
# reached the store as a bootstrap script's blob upload — bytes with no row, no name and no
# version, which is why every row-less byte in qits-platform-artifacts was a ci-daemon build. The PUT below
# writes the identity and the bytes in one transaction, so publishing without an identity is no
# longer expressible. (daemon-artifact-identity-plan.md §2.2 and §2.4.)
#
# `artifacts:` IS A DECLARATION, NOT A REPORT. qits-ci never learns how to publish anything — the
# PUT below is this repository's own step, exactly as `npm publish` and `docker push` are siblings'
# — so it cannot see what landed. It announces `SoftwareRelease {daemon, qits-ci-daemon}` on the
# strength of these two lines after the whole pipeline is green. Keep them true.
#
# THE NAME IS UNQUALIFIED for the same reason a docker declaration's is: no repository states a
# deployment's addresses. `qits-ci-daemon` is the daemon's name in the `daemons` repository, and
# the reader supplies its own host.
#
# THE PIN NOW MOVES ITSELF. qits-ci listens for the SoftwareRelease this step announces, launches
# the new version in a real container, and adopts it only once that container dials and speaks the
# host's protocol version — falling back to the version before it, and then to
# QITS_CI_DAEMON_VERSION, if it does not (ci-daemon-autoadopt-plan.md). Publishing here is therefore
# the whole act: nothing further to carry by hand. QITS_CI_DAEMON_VERSION stays qits-ci's bottom
# rung, moved only by a deliberate deployment act, for the platform to fall back to if every adopted
# release is rejected.
event: SCMRelease
when:
  - repository: { exact: qits-ci-daemon }
# THE RUN IS ANCHORED AT THE TAG IT BUILDS. `SCMRelease` carries `commitSha` — the commit the tag
# points at — since qits-projects 2026.905.73500, and qits-ci resolves these two dot-paths since
# 2026.905.83431. Before that the event named no commit at all: `branch` is the release request's
# BACKING BRANCH, which the tagging operation deletes, and `version` names a tag rather than a
# commit — so this file could declare no `checkout:`, the run was recorded at `main`, and every
# release displayed as `main@<head>`, a run recorded against a commit it did not build.
#
# `branch: version` IS NOT A MISNOMER. The key is named for the run row's ref column, and a tag is a
# ref: the daemon clones `--branch "$QITS_CI_BRANCH"`, which git resolves against tags exactly as
# against heads, and the sha is what `checkout --detach` then lands on. Nothing in qits-ci holds a
# concept of a tag.
#
# `optional: true` IS THE TRANSITION AND IT STAYS UNTIL NO OLD EVENT CAN ARRIVE. `commitSha` is
# additive, so an `SCMRelease` published before it existed — a replay out of the durable log, a
# hand-built event through qits-ci's manual trigger door — resolves nothing here. Without the flag
# that would cost this pipeline its run, which is a released version whose artifact is silently
# never published. With it, such a run is recorded at `main`'s head, byte-for-byte as before, and
# the `git fetch refs/tags/$version` in the step below is what supplies the released tree — which
# is why that fetch STAYS: a no-op on the anchored path, the whole mechanism on the fallback one.
checkout:
  branch: version       # the tag's name — a ref name, which `clone --branch` resolves
  sha: commitSha        # what it points at; absent on any release published before the field
  optional: true        # ...and then this run is main's head, exactly as it was before
artifacts:
  - { type: daemon, name: qits-ci-daemon }
steps:
    # ci-base: buildctl for the build, git for the tag checkout, curl for the PUT and jq for the two
    # JSON documents this step reads. Nothing needs node, and nothing needs maven on THIS side of
    # the builder — the compile happens in the toolchain image, as a stage.
    #
    # `build: true`, AND NO SOCKET AT ALL. This step used to declare `docker: true` for a
    # hand-rolled builder container (build the image, create, cp the source in, start, cp the binary
    # and the SBOM back out) — five verbs that existed only because a step container holding the
    # HOST daemon's socket cannot bind-mount its own /workspace. Everything below is buildctl and
    # curl now, so the step takes the build-mode environment (the commissioned credential, the
    # registry auth document, $QITS_BUILD_REGISTRY, and the $BUILDKIT_HOST qits-containers injects)
    # WITHOUT root-equivalence on the host. qits-buildkit-plan.md in the wrapper is the migration;
    # ci-event-release-request.yml beside this file carries the long form, and its own step keeps
    # `docker: true` for one reason this one does not have — a smoke probe that really starts a
    # container on the built binary.
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # The daemon runs this with `bash -c` and no -e, so without this a failed build is swallowed:
      # the PUT sends whatever stale file is around, or none, and the run still reports SUCCESS —
      # and a green release run is what makes qits-ci announce the artifact. -u makes an unset
      # injected variable stop the step too.
      set -eu

      # The platform builder, demanded loudly before anything is built. Unset means a
      # qits-ci/qits-containers pair too old to inject it; EMPTY means the kill switch
      # (qits.ci.buildkit.enabled=false spells off as empty-never-absent). Either way this recipe
      # must fail here, naming the cause, rather than reach for a socket it is no longer handed.
      : "${BUILDKIT_HOST:?the platform builder is off or not injected; this recipe builds only through it}"
      : "${QITS_BUILD_REGISTRY:?}"

      # THE EVENT, READ AS DATA. The payload reaches the container verbatim as one string in
      # $QITS_EVENT_PAYLOAD; there is no per-field projection.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .version)
      # SCMRelease versions are CalVer — digits and dots. Checked before anything is built, for two
      # reasons: the version is a path segment in the PUT below, and an absent or malformed one
      # would otherwise publish a daemon under a coordinate nobody can guess. qits-oci's release
      # pipeline refuses the same way for the same reason.
      case "$version" in
        ''|*[!0-9.]*) echo "SCMRelease carries no valid CalVer" >&2; exit 1 ;;
      esac
      echo "releasing qits-ci-daemon $version"

      # THE TAG IS THE CHECKOUT TARGET. An event-triggered run is cloned at the head of main, which
      # is where the release commit is *now* — a later push moves that and the tag does not, so a
      # busy main cannot make this pipeline ship a different tree than the one that was released.
      # The clone is shallow and carries no tags, hence the explicit refspec; the URL rather than
      # `origin` because every address a step needs arrives as environment.
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"

      # --- the toolchain image ----------------------------------------------------------------------
      # Built here because nothing releases it, and PUSHED because a `FROM` is resolved from a
      # registry and from nowhere else — docker/Dockerfile's build stage names it. The tag is fixed
      # and overwritten in place, so this costs the registry one image rather than a version per
      # build, and it is deliberately NOT one of the `artifacts:` above: nothing declares it,
      # nothing deploys it, and it is a cache coordinate for one builder.
      #
      # THE TARBALL URLS ARE THIS RUN'S, NOT THE DOCKERFILE'S DEFAULTS. BuildKit resolves an
      # `ADD <url>` in the BUILDER's own network context, which is qits-net; the committed defaults
      # name registry.dev.localhost:8080, an edge vhost on the host loopback. The in-network route
      # is the injected $QITS_MAVEN_REGISTRY_URL, and the maven COORDINATE is read out of the
      # Dockerfile rather than restated here, so a toolchain bump stays one file.
      # ci-event-release-request.yml carries the full reasoning; these lines must stay matched with
      # it, argument for argument, because the builder's cache is shared and that is what makes a
      # release following a green fold a stack of cache hits rather than a second native compile.
      maven_root="${QITS_MAVEN_REGISTRY_URL%/}"
      musl_url=$(sed -n 's/^ARG MUSL_URL=//p' docker/Dockerfile.musl-builder)
      zlib_url=$(sed -n 's/^ARG ZLIB_URL=//p' docker/Dockerfile.musl-builder)
      : "${musl_url:?docker/Dockerfile.musl-builder declares no ARG MUSL_URL}"
      : "${zlib_url:?docker/Dockerfile.musl-builder declares no ARG ZLIB_URL}"
      musl_url="$maven_root${musl_url#*/artifacts/maven/maven}"
      zlib_url="$maven_root${zlib_url#*/artifacts/maven/maven}"

      builder="$QITS_BUILD_REGISTRY/$QITS_IMAGE_REPOSITORY/graalvmce-musl-builder:jdk-25"
      buildctl build --frontend dockerfile.v0 \
        --local context=docker --local dockerfile=docker \
        --opt filename=Dockerfile.musl-builder \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        --output "type=image,name=$builder,push=true"

      # --- the binary -----------------------------------------------------------------------------
      # The QA pipeline's build, byte for byte: docker/Dockerfile compiles inside the toolchain
      # image and ends on a `FROM scratch` holding the one file, so the export writes
      # out/qits-ci-daemon. No `--network host` and nothing replaces it — the RUN
      # executes in the builder's namespace on qits-net, so Maven Central goes through the mirror's
      # IN-NETWORK route ($QITS_MAVEN_PROXY_URL) and an empty value deactivates the settings profile
      # so the resolve goes to Central directly, as it always did. No credential rides along:
      # platform reads are anonymous.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=binary \
        --opt build-arg:BUILDER_IMAGE="$builder" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --output type=local,dest=out

      # THE DOCUMENT COMES OUT OF THE SAME BUILD AS THE BINARY, and it has to: the reactor and its
      # resolved dependency tree exist only in there — this step's own container carries no maven at
      # all. `makeBom` rides on the Dockerfile's one mvnw invocation rather than a second one, so
      # the document describes the very resolve that produced the bytes beside it, and the export
      # below reaches a `FROM scratch AS sbom` stage holding just that file. Build-args are
      # BYTE-IDENTICAL to the binary export above, which is what makes every layer a cache hit in
      # the same builder and this export seconds rather than a second native compile.
      #
      # cyclonedx.skipNotDeployed=false is LOAD-BEARING and now lives in docker/Dockerfile beside
      # the invocation it belongs to; its measurement and the exact spelling are argued there.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:BUILDER_IMAGE="$builder" \
        --opt build-arg:QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}" \
        --output type=local,dest=out

      # --- the publish ----------------------------------------------------------------------------
      # The address is DERIVED, not spelled: no repository states a deployment's addresses, and the
      # Maven root is the injected variable that already carries this service's in-network origin
      # (http://qits-platform-artifacts:8080/...). Its own reading of "reachable from where" is the one that
      # applies here — the PUT is an ordinary HTTP call from THIS container over qits-net, needing
      # no socket and no privilege, exactly like an npm publish. $QITS_REGISTRY is the opposite
      # reading (a host-published mapping the docker daemon dials) and must not be used for it.
      artifacts=$(printf '%s' "$QITS_MAVEN_REGISTRY_URL" | sed -E 's#^(https?://[^/]+).*#\1#')

      # THE PUT CARRIES NO CREDENTIAL, and that is the platform's posture rather than a gap: the
      # daemon publish surface is tokenless like `npm publish`, `mvn deploy` and `docker push`,
      # because on qits-net producers are trusted. What keeps it honest is the 409 below — a version
      # is immutable, so this step can add a version and can never change one. Do not invent a static
      # token here; machine auth arrives with qits-platform-idp for every publish path at once.

      # One request stages the bytes, promotes them and inserts the row. 409 means this version
      # already exists, and it is a HARD FAILURE rather than a skip: versions are immutable here,
      # so a 409 says the release train tried to ship a coordinate that is already spoken for, and
      # letting it pass would announce a SoftwareRelease for bytes nobody published. That is the
      # one place this differs from the maven and npm release steps, which skip an already-present
      # version because re-running their publish is a no-op and re-running this one is a lie.
      status=$(curl -sS -o /tmp/daemon-publish.json -w '%{http_code}' -X PUT \
        -H 'Content-Type: application/octet-stream' \
        --data-binary @out/qits-ci-daemon \
        "$artifacts/artifacts/daemons/qits-ci-daemon/$version")
      case "$status" in
        201) ;;
        409)
          echo "qits-ci-daemon $version is already published — a version is never republished" >&2
          cat /tmp/daemon-publish.json >&2
          exit 1 ;;
        *)
          echo "publish answered $status: $(cat /tmp/daemon-publish.json)" >&2
          exit 1 ;;
      esac

      # THE DIGEST IS PRINTED FOR A HUMAN READING THE LOG, not for carrying across by hand: qits-ci
      # adopts this version off the SoftwareRelease announced below on its own, and pins by version
      # rather than by digest (ci-daemon-autoadopt-plan.md §2.2).
      digest=$(jq -er .digest /tmp/daemon-publish.json)
      echo "published qits-ci-daemon $version, $(jq -er .sizeBytes /tmp/daemon-publish.json) bytes, digest $digest"

      # --- the SBOM -------------------------------------------------------------------------------
      # AFTER THE PUBLISH AND BEFORE THIS STEP EXITS GREEN, which is the ordering rule rather than a
      # preference: qits-ci announces `SoftwareRelease` only for a green run, so a document stored
      # here can never be missing for a version somebody was told about. A failed PUT fails the
      # release ON PURPOSE — the store being down is not a reason to announce a version nobody can
      # audit. And it goes SECOND on purpose too: the 409 above is what makes a version immutable,
      # so a re-run that would have overwritten a document stops before it reaches this line.
      #
      # THE PATH NAMES THE DECLARED ARTIFACT IDENTITY VERBATIM. `artifacts:` above says
      # `{type: daemon, name: qits-ci-daemon}`, and (packageType, packageName, version) is how the
      # SoftwareRelease consumer will ask for it — the same coordinate under a `sboms` sibling of
      # the `daemons` path the bytes went to, and derived from the same $artifacts origin for the
      # same reason: no repository states a deployment's addresses, and $QITS_REGISTRY is the
      # opposite reading of "reachable from where".
      sbom_base="$artifacts/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @out/sbom.json \
        "$sbom_base/daemon/qits-ci-daemon/-/$version"
