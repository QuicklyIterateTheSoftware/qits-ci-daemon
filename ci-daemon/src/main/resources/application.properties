# ci-daemon — the binary that runs inside a qits-ci step container.
#
# There is almost nothing to configure here, and that is the design: everything the daemon needs is
# injected as container env by qits-ci's launcher, and the daemon is TOLD rather than deriving. The
# keys below are the env contract, left unset on purpose so a binary run with no environment fails
# with one honest sentence about what is missing instead of dialling a default.
#
#   QITS_CI_DAEMON_URL      -> qits.ci.daemon-url       the control socket, dialled VERBATIM
#   QITS_CI_DAEMON_ID       -> qits.ci.daemon-id        host-minted registration identity
#   QITS_CI_REPOSITORY_URL  -> qits.ci.repository-url   what to clone
#   QITS_CI_BRANCH          -> qits.ci.branch           which branch to shallow-clone
#   QITS_CI_SHA             -> qits.ci.sha              which commit to check out
#   QITS_TOKEN              -> qits.token               the run's own ci-run token; the handshake
#                                                       is `Authorization: Bearer` and nothing else
#
# One more is OPTIONAL:
#
#   QITS_TOKEN_SUBJECT      -> qits.token-subject       names the token in one log line; never sent
#
# Six more are read as LABELS ONLY — resource attributes on the telemetry (see Telemetry and the
# README's "Telemetry" section), never an input to anything the daemon does. Each is optional: a
# missing one is an attribute left out, never MISCONFIGURED.
#
#   QITS_CI_RUN_ID          -> qits.ci.run-id           qits.ci.run_id; also seeds the trace id
#   QITS_CI_STEP_INDEX      -> qits.ci.step-index       qits.ci.step_index
#   QITS_CI_REPO_ID         -> qits.ci.repo-id          qits.ci.repo_id
#   QITS_CI_REPO_NAME       -> qits.ci.repo-name        qits.ci.repo_name
#   QITS_CI_PROJECT_ID      -> qits.ci.project-id       qits.ci.project_id
#   QITS_DOMAIN             -> qits.domain              qits.domain
#
# They used to be deliberately NOT read: they exist for the step's script, which inherits the
# daemon's environment, and reading a value the daemon had no use for would only have invited
# someone to make it load-bearing. Telemetry is that use, and labels are where it stops. CI and
# QITS_CI are still not read.
#
# Every one of these is Optional<String> in Main. An empty `defaultValue` is not a default —
# SmallRye reads defaultValue="" as *no value* and then fails to resolve a plain String, and the
# binary dies at startup with "Failed to load config value of type class java.lang.String".
# qits.ci.daemon-url=
# qits.ci.daemon-id=
# qits.ci.repository-url=
# qits.ci.branch=
# qits.ci.sha=
# qits.token=
# qits.token-subject=
# qits.ci.run-id=
# qits.ci.step-index=
# qits.ci.repo-id=
# qits.ci.repo-name=
# qits.ci.project-id=
# qits.domain=

# Where the checkout lands. A constant in practice (qits-ci's launcher and the image contract both
# assume /workspace); a key so the suite can point it at a temp directory.
qits.ci.workspace-dir=/workspace

# Liveness ping cadence, from dial until close. The host's step timeout is a backstop, not a
# liveness probe, so this has to run underneath a step that prints nothing for minutes.
qits.ci.heartbeat-interval-ms=10000

# The dial retry budget — TOTAL, not per attempt, and deliberately short. A daemon that cannot reach
# its host is a container the host will reap on its own register timeout anyway, so retrying past
# that point only delays an outcome that is already decided. Exhausting the budget exits nonzero.
qits.ci.dial-budget-ms=30000
qits.ci.dial-initial-backoff-ms=500
qits.ci.dial-max-backoff-ms=5000

# The reconnect budget — also a TOTAL, counted from the moment a connected socket drops until the
# host speaks on a new one. It covers an edge redeploy, which drops every step's socket while the
# step keeps running (qits-748), and it must be at least qits-ci's own
# qits.ci.daemon.reconnect-grace-seconds, or the daemon gives up on a launch the host still holds.
# Exhausting it exits 6. The same backoff as the dial paces the attempts.
qits.ci.reconnect-budget-ms=90000

# How long a git invocation may run. The clone is the long one (a cold shallow clone of a large
# repo), which is why this is minutes rather than seconds; qits-ci's own init timeout sits above it.
qits.ci.git-timeout-seconds=600

# qits-1253: delays before each re-clone after the git host answers with a transient failure (a
# 503, a dropped connection) — see Workspace.cloneWithRetry(). Comma-separated and ISO-8601-ish with
# the `PT` prefix implied, so "2S,5S" is two retries, after 2s and then 5s (three clone attempts in
# all). A clone failure that is NOT transient — a bad branch, a 4xx — still fails after one attempt.
qits.ci.clone-retry-delays=2S,5S

# Grace between SIGTERM and SIGKILL when the daemon ends its child — at a timeout or a Cancel.
qits.ci.step-kill-grace-ms=5000

# --- telemetry: the daemon's own log, its step's output and its spans, to qits-observability -----
# QITS_CI_TELEMETRY_URL (qits.ci.telemetry-url) is the OTLP endpoint, /v1/logs and /v1/traces
# appended. Left unset on purpose: unset DERIVES it from the control socket's url
# (wss://ci.<rest>/ci/daemon -> https://observability.<rest>/observability/api/otel), and an EMPTY
# QITS_CI_TELEMETRY_URL switches the export off. Main reads that variable raw, because SmallRye reads
# an empty value as no value and the two would be indistinguishable here.
# qits.ci.telemetry-url=
#
# The bound on the flush that runs BEFORE the terminal frame: qits-ci reaps the container the moment
# StepFinished arrives, so the flush has to come first, and an unreachable collector may delay the
# frame by at most this long. Never changes the step's result or exit code.
qits.ci.telemetry-flush-ms=3000
#
# How many of the step's output lines are exported — the LATEST ones, because the failure is at the
# end. Every step on the estate shares one qits-ci-daemon bucket of a few thousand records, so this
# cap is load-bearing: one chatty build must not evict every other step's telemetry.
qits.ci.telemetry-output-max-lines=200

# Name the compiled artifact `qits-ci-daemon` (not ci-daemon-<version>-runner): the bootstrap
# downloads it under that name and execs it as the container's process, so it is what `ps` shows.
quarkus.package.output-name=qits-ci-daemon
quarkus.package.jar.add-runner-suffix=false

# Lean and quiet. The daemon's stdout IS the diagnosis for a container that never registered —
# qits-ci captures a bounded `docker logs` tail before reaping one — so what is logged matters and
# a banner is noise in it.
quarkus.log.level=INFO
quarkus.banner.enabled=false

# --- the shipping form: a fully static musl native image -------------------------------------------
# Proven in the wave-0 spike (Quarkus 3.34.6, vert.x WebSocketClient in the image, runs in alpine:3
# and debian:bookworm-slim). Each line below is load-bearing:
#
#  * container-build, because the musl toolchain lives in the builder image and not on any host.
#  * builder-image, which is LOCAL-ONLY and built from docker/Dockerfile.musl-builder. It is not the
#    Mandrel image qits-workspace-daemon uses and cannot be — Mandrel ships no musl static JDK
#    libraries. That Dockerfile's header has the error message and the whole story.
#  * builder-image.pull=missing. Without it every build tries to `docker pull` an image that exists
#    only locally and fails outright. NOTE the key: on Quarkus 3.34 the old
#    `quarkus.native.pull-always` is gone and is IGNORED SILENTLY — setting it looks like it worked
#    and changes nothing.
#  * --static --libc=musl, the point of the exercise. A glibc-linked binary does not execute at all
#    on an alpine-family image, and pipeline configs declare those constantly.
#
# Verifying a build: `file` reports "static-pie linked", NOT the literal "statically linked" — GraalVM
# 25 emits a position-independent static executable. It is genuinely fully static; `ldd` is the
# assertion to write, or `static-pie`.
quarkus.native.container-build=true
quarkus.native.builder-image=qits/graalvmce-musl-builder:jdk-25
quarkus.native.builder-image.pull=missing
quarkus.native.additional-build-args=--static,--libc=musl

# CiDaemonBinary.VERSION reads this resource from the protocol jar, and the telemetry's
# service.version is the first thing in the binary that touches it. Native Image registers a
# getResourceAsStream with a constant name by itself, but a version that resolved to nothing would
# throw at class init — mid-step, inside a container — so it is named here rather than left to the
# analysis.
quarkus.native.resources.includes=eu/wohlben/qits/cidaemon/protocol/ci-daemon-binary.properties

# --- TLS in the native image: a wss:// control socket ----------------------------------------------
# A step on a remote runner dials wss://ci.<env>.<domain>/ci/daemon through the edge, so the binary
# has to speak TLS — and it has to trust the edge's certificate without any help from the container
# it runs in. The step image is arbitrary: its /etc/ssl may be empty, stale, or missing entirely,
# and a static musl binary has no system trust store of its own to fall back on.
#
#  * quarkus.ssl.native=true, because NOTHING ELSE TURNS IT ON HERE. Quarkus enables native SSL by
#    itself only when an extension asks (ExtensionSslNativeSupportBuildItem — rest-client, oidc,
#    vertx-http and friends); quarkus-arc, quarkus-vertx and quarkus-netty, the whole of this
#    binary, do not. With it off, Quarkus 3.34's Target_javax_net_ssl_SSLContext substitution makes
#    SSLContext.getDefault() a DisabledSSLContext at run time — read from quarkus-core's bytecode,
#    not from a doc. On, it also registers the https URL handler (unused: the dial is netty, not
#    java.net.URL) and keeps the JSSE providers in the image.
#  * The trust roots are the BUILD JDK's lib/security/cacerts, which GraalVM Native Image loads at
#    image build time and embeds in the image heap as the default trust store (its "Certificate
#    Management in Native Image" behaviour; overridable at run time only with
#    -Djavax.net.ssl.trustStore, which nothing here passes). So the edge's certificate must chain to a
#    public root in the builder image's JDK — a private CA would need its own truststore baked in.
#
# The JVM suite dials a wss:// stub (DaemonMainTest) and proves the handshake and the verification;
# it cannot prove the native image's embedded store. The release recipe's native build is what
# carries this line, and the first EDGE-plane step is what exercises it.
quarkus.ssl.native=true
